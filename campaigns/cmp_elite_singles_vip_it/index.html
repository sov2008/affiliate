<!DOCTYPE html><html><head><title>High Converting Offer</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen"><div class="text-center"><h1 class="text-4xl font-bold mb-4">Exclusive Access</h1><a href="https://postback-engine.sov7.workers.dev/click?ml_sub1={click_id}&ml_sub2={campaign_id}&ml_sub3={variant}" class="bg-blue-500 px-6 py-3 rounded text-xl font-bold">Claim Now</a></div>
<script>
(function(){
  try {
    const lang = (navigator.language || navigator.userLanguage).split('-')[0].toUpperCase();
    const availableGeos = ["DE","FR","IT"];
    const current = "IT";
    
    // Only suggest if the language matches an available geo, and it's not the current one
    if (lang !== current && availableGeos.includes(lang)) {
      // Suggest redirection or auto-redirect
      const doRedirect = confirm("We noticed your browser language is " + lang + ". Would you like to view the localized version?");
      if (doRedirect) {
        // Simple replace in URL (assuming campaign structure like cmp_name_DE)
        window.location.href = window.location.href.replace("_" + current, "_" + lang);
      }
    }
  } catch (e) {
    console.error("Geo-localization error:", e);
  }
})();
</script>


<script>
document.addEventListener('DOMContentLoaded', () => {
  const links = document.querySelectorAll('a');
  links.forEach(a => {
    a.addEventListener('click', (e) => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const clickId = urlParams.get('click_id') || '';
        const variant = window.location.pathname.includes('/v2') ? 'v2' : 'v1';
        // Extract base campaign id without variant
        const baseCampaignId = "cmp_elite_singles_vip_it".split('/')[0];
        navigator.sendBeacon('http://localhost:8787/click?click_id=' + clickId + '&variant=' + variant + '&campaign_id=' + baseCampaignId);
      } catch(err) {}
    });
  });
});
</script>
  
</body></html>
