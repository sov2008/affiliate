<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer - E-commerce Smart Gadget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ensuring a clean and high-converting base */
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden text-center">
        <div class="bg-indigo-600 p-6 text-white">
            <h1 class="text-2xl font-extrabold mb-2">E-commerce Smart Gadget</h1>
            <p class="text-indigo-200">Exclusive limited-time offer</p>
        </div>
        
        <div class="p-8">
            <p class="text-gray-600 mb-6 text-lg">
                Congratulations! You are eligible for this special promotion. Click below to claim your offer before it expires.
            </p>
            
            <a id="cta-button" href="https://example-tracker.com/click?offer=smart123" 
               class="block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1 hover:shadow-2xl">
                Claim Offer Now
            </a>
            
            <p class="text-xs text-gray-400 mt-6">
                Terms and conditions apply. Limited availability.
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ctaButton = document.getElementById('cta-button');
            
            if (ctaButton && urlParams.toString()) {
                const ctaUrl = new URL(ctaButton.href);
                
                const paramsToForward = ['click_id', 'sub1', 'sub2', 'sub_id'];
                paramsToForward.forEach(param => {
                    const value = urlParams.get(param);
                    if (value) {
                        ctaUrl.searchParams.set(param, value);
                    }
                });
                
                ctaButton.href = ctaUrl.toString();
            }
        });
    </script>
</body>
</html>
