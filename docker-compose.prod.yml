version: '3.8'

services:
  affiliate-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: antigravity/affiliate-core:latest
    container_name: antigravity-affiliate-core
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - SQLITE_BUSY_TIMEOUT=15000
      - SQLITE_WAL_MODE=true
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - POSTBACK_WORKER_URL=${POSTBACK_WORKER_URL:-https://postback-engine.sov7.workers.dev}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
    volumes:
      - ./core/data:/app/data
      - ./.antigravity:/app/.antigravity
      - ./blog/dist:/app/blog/dist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - affiliate-net

networks:
  affiliate-net:
    driver: bridge
