version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: flirtcheck/deeptrace:latest
    container_name: flirtcheck-deeptrace-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://flirtcheck.site}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - NVIDIA_VISION_MODEL=${NVIDIA_VISION_MODEL:-meta/llama-3.2-11b-vision-instruct}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-10485760}
      - ANALYSIS_TIMEOUT_MS=${ANALYSIS_TIMEOUT_MS:-25000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - deeptrace-net

networks:
  deeptrace-net:
    driver: bridge
