<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 800px;
      height: 800px;
      background: #0B0F19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Ambient Glow Behind Icon */
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.4) 0%, rgba(225, 29, 72, 0.25) 50%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .icon-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Squircle Favicon Base (exact match with favicon.svg) */
    .favicon-squircle {
      width: 440px;
      height: 440px;
      border-radius: 110px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 55%, #e11d48 100%);
      box-shadow: 0 30px 70px rgba(79, 70, 229, 0.5), inset 0 0 0 6px rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Brand Typography matching custom-logo.svg */
    .brand-group {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-title {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand-subtitle {
      margin-top: 8px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #38bdf8;
      text-transform: uppercase;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="icon-container">
    <!-- Favicon Squircle -->
    <div class="favicon-squircle">
      <svg viewBox="0 0 512 512" width="370" height="370" fill="none">
        <defs>
          <linearGradient id="sweepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
          </linearGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Radar Rings -->
        <circle cx="256" cy="256" r="176" stroke="#ffffff" stroke-width="14" stroke-opacity="0.28" />
        <circle cx="256" cy="256" r="116" stroke="#ffffff" stroke-width="14" stroke-opacity="0.45" />
        <circle cx="256" cy="256" r="56" stroke="#ffffff" stroke-width="14" stroke-opacity="0.7" />

        <!-- Radar Sector Beam -->
        <path d="M 256 256 L 380 132 A 176 176 0 0 0 256 80 Z" fill="url(#sweepGrad)" />
        <line x1="256" y1="256" x2="380" y2="132" stroke="#ffffff" stroke-width="20" stroke-linecap="round" filter="url(#softGlow)" />

        <!-- Hot Deal Target Blip -->
        <circle cx="360" cy="152" r="26" fill="#38bdf8" filter="url(#softGlow)" />
        <circle cx="360" cy="152" r="14" fill="#ffffff" />

        <!-- Center Core Beacon -->
        <circle cx="256" cy="256" r="34" fill="#ffffff" filter="url(#softGlow)" />
        <circle cx="256" cy="256" r="19" fill="#e11d48" />
      </svg>
    </div>

    <!-- Official Brand Typography from custom-logo.svg -->
    <div class="brand-group">
      <div class="brand-title">PROMORADAR</div>
      <div class="brand-subtitle">CONTROL HUB</div>
    </div>
  </div>
</body>
</html>
