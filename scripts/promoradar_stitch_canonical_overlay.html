<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1000px;
      height: 1500px;
      position: relative;
      overflow: hidden;
      background: #0B0F19;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    .stitch-bg {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 1500px;
      object-fit: cover;
      z-index: 1;
    }
    /* Бесшовный перекрывающий оверлей для замены сгенерированного AI логотипа на канонический сайта */
    .header-overlay-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 1000px;
      height: 295px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 68px;
      background: linear-gradient(180deg, #07090F 0%, #07090F 75%, rgba(7,9,15,0.92) 88%, transparent 100%);
    }
    .brand-cluster {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    /* Точный сквиркл сайта (Header.astro) */
    .canonical-logo-badge {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      background: linear-gradient(135deg, #4F46E5 0%, #4338CA 50%, #E11D48 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 32px -4px rgba(79, 70, 229, 0.6), 0 0 0 1.5px rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }
    .canonical-logo-badge svg {
      width: 46px;
      height: 46px;
      color: #FFFFFF;
    }
    .brand-meta {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .brand-title {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #FFFFFF;
      line-height: 1;
    }
    .brand-subtitle {
      font-size: 16px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }
    .status-pill {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 24px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #818CF8;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .status-pill .ping {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 12px #10B981;
    }
  </style>
</head>
<body>
  <img class="stitch-bg" src="{{STITCH_RAW_IMAGE}}" />

  <!-- 100% ТОЧНЫЙ КАНОНИЧЕСКИЙ ЛОГОТИП САЙТА PROMORADAR (Header.astro) -->
  <div class="header-overlay-zone">
    <div class="brand-cluster">
      <div class="canonical-logo-badge">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" stroke-width="2" opacity="0.4"></circle>
          <circle cx="12" cy="12" r="5" stroke-width="2" opacity="0.75"></circle>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 12l6-6"></path>
          <circle cx="12" cy="2" fill="currentColor"></circle>
        </svg>
      </div>
      <div class="brand-meta">
        <span class="brand-title">PromoRadar</span>
        <span class="brand-subtitle">Verified Promo Codes &amp; Deals</span>
      </div>
    </div>
    <div class="status-pill">
      <span class="ping"></span>
      <span>VERIFIED VOUCHER RADAR • OCTOBER 2026</span>
    </div>
  </div>
</body>
</html>
