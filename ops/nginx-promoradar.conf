# ==============================================================================
# PromoRadar (promoradar.store) High-Performance Production Nginx Configuration
# Target: /var/www/promoradar.store/current (Atomic Symlink Deployment)
# Edge: Cloudflare CDN + SSL Termination / Strict Origin
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name promoradar.store www.promoradar.store;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name promoradar.store www.promoradar.store;

    # Atomic symlink deploy root
    root /var/www/promoradar.store/current;
    index index.html;

    server_tokens off;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/promoradar.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promoradar.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # High-Performance Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/markdown
        text/calendar
        text/x-component
        text/vcard
        text/cache-manifest
        text/vtt;

    # --------------------------------------------------------------------------
    # Static Assets Caching (/_astro/* & hashed builds)
    # --------------------------------------------------------------------------
    location ^~ /_astro/ {
        # Astro Vite bundles contain content hashes in filenames (immutable)
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /logos/ {
        # Local partner program logos
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|otf|webp|png|jpe?g|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Affiliate / Partner Network Verification Files (Admitad, Impact, CJ)
    # --------------------------------------------------------------------------
    location ~* ^/(admitad-verification\.txt|dcaf1a95-f2a7-42c8-b67f-4a463294ee43\.txt|\.well-known/) {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # TDS Outbound Click Redirection (/go)
    # --------------------------------------------------------------------------
    location /go {
        limit_req zone=tds_limit burst=20 nodelay;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host flirtcheck.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Telemetry Dashboard Proxy
    # --------------------------------------------------------------------------
    location ~* ^/dashboard {
        return 301 http://178.128.199.28:3456/;
    }

    # --------------------------------------------------------------------------
    # HTML Document Delivery & Edge Microcaching (<30ms TTFB)
    # --------------------------------------------------------------------------
    location / {
        # HTML pages: 5-minute browser cache, 30-minute edge cache, 24-hour stale-while-revalidate
        add_header Cache-Control "public, max-age=300, s-maxage=1800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri $uri/index.html $uri/ /index.html =404;
    }
}
