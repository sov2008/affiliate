name: Continuous Multi-Network CPA Catalog Ingestion & Deploy

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    name: 🔄 Multi-Network CPA Sync (Admitad, CJ, Awin)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: promoradar-portal
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: deals-portal/package-lock.json

      - name: 📦 Install Root & Deals Portal Dependencies
        run: |
          npm install --no-audit --prefer-offline || npm ci
          cd deals-portal && npm ci

      - name: 🚀 Run Multi-Network CPA Autonomous Sync & Intake
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_BASE64_HEADER: ${{ secrets.ADMITAD_BASE64_HEADER }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
          CJ_KEY: ${{ secrets.CJ_KEY }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/multi_network_cpa_sync.cjs

      - name: 🔍 Check for Catalog Changes
        id: check_changes
        run: |
          git status -s deals-portal/src/data/couponsData.ts
          if git diff --quiet deals-portal/src/data/couponsData.ts; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No new offers or catalog changes detected. Skipping build and deploy."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "⚡ Catalog updated with fresh affiliate offers. Proceeding to build and deploy."
          fi

      - name: 🔨 Compile Production Static Build (Only on New Changes)
        if: steps.check_changes.outputs.has_changes == 'true'
        working-directory: deals-portal
        run: |
          echo "Compiling PromoRadar static bundle..."
          npm run build

      - name: 🔒 Setup Production SSH Key
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST || '178.128.199.28' }} >> ~/.ssh/known_hosts

      - name: 🚀 Atomically Deploy to DigitalOcean
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          DO_HOST: ${{ secrets.DO_HOST || '178.128.199.28' }}
          DO_USER: ${{ secrets.DO_USER || 'root' }}
        run: |
          node scripts/direct_deploy_promoradar.cjs

      - name: 🔔 Ping Search Engines via IndexNow
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          node scripts/seo_index_pinger.cjs || true

      - name: 💾 Commit & Push Updated Catalog to GitHub
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "PromoRadar Automated Bot"
          git config --global user.email "bot@promoradar.store"
          git add -A
          git commit -m "chore(catalog): automated continuous CPA multi-network catalog sync [skip ci]" || echo "Nothing to commit"
          git fetch origin promoradar-portal
          git rebase origin/promoradar-portal || (git rebase --abort 2>/dev/null; git pull --no-rebase origin promoradar-portal -X ours)
          git push origin HEAD:promoradar-portal

      - name: 🚨 Telegram Alert on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            MSG="🚨 <b>[PROMORADAR: CONTINUOUS CPA CATALOG SYNC FAILED]</b>%0A━━━━━━━━━━━━━━━━━━%0A❌ <b>Workflow:</b> <code>continuous-catalog-sync.yml</code>%0A🔗 <b>Run URL:</b> <a href=\"$RUN_URL\">$RUN_URL</a>%0A⚠️ <i>Immediate review required.</i>"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML" || true
          fi
