name: PromoRadar Deals Portal CI/CD

on:
  push:
    branches:
      - promoradar-portal
      - main
    paths:
      - 'deals-portal/**'
      - '.github/workflows/promoradar-ci-cd.yml'
  pull_request:
    branches:
      - promoradar-portal
      - main
    paths:
      - 'deals-portal/**'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. CI: Build, Validate 46 Static Pages & Schema.org
  # ----------------------------------------------------
  build-and-test:
    name: 🧪 Build & Validate PromoRadar (Astro)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: deals-portal/package-lock.json

      - name: 📦 Install Deals Portal Dependencies
        working-directory: deals-portal
        run: npm ci

      - name: 🔨 Compile Production Static Build (Astro Build)
        working-directory: deals-portal
        run: npm run build

      - name: 🔍 Verify Output Integrity & 46 Pages
        working-directory: deals-portal
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f dist/stores/index.html || { echo "❌ dist/stores/index.html missing"; exit 1; }
          test -f dist/stores/expressvpn/index.html || { echo "❌ dist/stores/expressvpn/index.html missing"; exit 1; }
          test -f dist/sitemap-0.xml || { echo "❌ dist/sitemap-0.xml missing"; exit 1; }
          echo "✅ All core static pages, sitemaps, and Schema.org snippets generated successfully!"

      - name: 📦 Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: promoradar-dist
          path: deals-portal/dist/
          retention-days: 7

  # ----------------------------------------------------
  # 2. CD: Automated Deployment to DigitalOcean Droplet
  # ----------------------------------------------------
  deploy:
    name: 🚀 Deploy to DigitalOcean (178.128.199.28)
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: promoradar-dist
          path: dist-artifact

      - name: 🚀 Deploy to DigitalOcean via SSH
        if: ${{ env.DO_KEY != '' }}
        env:
          DO_KEY: ${{ secrets.DO_SSH_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST || '178.128.199.28' }}
          username: ${{ secrets.DO_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying PromoRadar build on 178.128.199.28..."
            mkdir -p /var/www/affiliate/deals-portal/dist
            # Recreate verification tags
            echo "dcaf1a95-f2a7-42c8-b67f-4a463294ee43" > /var/www/affiliate/deals-portal/dist/dcaf1a95-f2a7-42c8-b67f-4a463294ee43.txt
            echo "fa9e3fd878" > /var/www/affiliate/deals-portal/dist/admitad-verification.txt
            nginx -t && systemctl reload nginx
            echo "✅ PromoRadar live deployment successful!"

      - name: ℹ️ Droplet SSH Notice
        if: ${{ env.DO_KEY == '' }}
        env:
          DO_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          echo "ℹ️ Direct SSH deploy step skipped: DO_SSH_KEY secret is not set in GitHub repository settings."
          echo "✅ PromoRadar artifacts successfully validated and archived in GitHub Actions."
