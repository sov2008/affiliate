name: PromoRadar Deals Portal CI/CD

on:
  push:
    branches:
      - promoradar-portal
      - main
    paths:
      - 'deals-portal/**'
      - '.github/workflows/promoradar-ci-cd.yml'
  pull_request:
    branches:
      - promoradar-portal
      - main
    paths:
      - 'deals-portal/**'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. CI: Build, Validate 46 Static Pages & Schema.org
  # ----------------------------------------------------
  build-and-test:
    name: 🧪 Build & Validate PromoRadar (Astro)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: deals-portal/package-lock.json

      - name: 📦 Install Deals Portal Dependencies
        working-directory: deals-portal
        run: npm ci

      - name: 🔨 Compile Production Static Build (Astro Build)
        working-directory: deals-portal
        run: npm run build

      - name: 🔍 Verify Output Integrity, WebMCP & llms.txt
        run: |
          test -f deals-portal/dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f deals-portal/dist/stores/index.html || { echo "❌ dist/stores/index.html missing"; exit 1; }
          test -f deals-portal/dist/llms.txt || { echo "❌ dist/llms.txt missing"; exit 1; }
          test -f deals-portal/dist/llms-full.txt || { echo "❌ dist/llms-full.txt missing"; exit 1; }
          test -f deals-portal/dist/scripts/webmcp-bridge.js || { echo "❌ dist/scripts/webmcp-bridge.js missing"; exit 1; }
          test -f deals-portal/dist/sitemap-0.xml || { echo "❌ dist/sitemap-0.xml missing"; exit 1; }
          node scripts/catalog_validator.cjs
          echo "✅ All core static pages, WebMCP, llms.txt, and catalog validator passed successfully!"

      - name: 📦 Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: promoradar-dist
          path: deals-portal/dist/
          retention-days: 7

  # ----------------------------------------------------
  # 2. CD: Automated Deployment to DigitalOcean Droplet
  # ----------------------------------------------------
  deploy:
    name: 🚀 Deploy to DigitalOcean (178.128.199.28)
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: promoradar-dist
          path: dist-artifact

      # Step skipped if DO_SSH_KEY is not defined, or deploy script handled atomically via direct_deploy_promoradar.cjs
      # To prevent creating empty release directories if artifacts are not transferred via scp, we disable the raw ssh-action step
      - name: ℹ️ Droplet Deployment Notice
        run: |
          echo "ℹ️ Direct deployment is securely managed by scripts/direct_deploy_promoradar.cjs and local/remote deploy runner."
          echo "✅ PromoRadar artifacts successfully built, validated, and archived."
