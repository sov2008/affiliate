<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" width="280" height="40" fill="none">
  <!-- Brand Icon Badge (36x36) -->
  <g transform="translate(2, 2)">
    <rect width="36" height="36" rx="4" fill="#0F172A" />
    <!-- Verification Shield -->
    <path d="M18 7 L27 11 V19 C27 24.5 18 29 18 29 C18 29 9 24.5 9 19 V11 Z" 
          stroke="#FFFDF9" 
          stroke-width="1.8" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    <!-- Reticle Crosshairs -->
    <line x1="12" y1="18" x2="24" y2="18" stroke="#FFFDF9" stroke-width="1.3" stroke-linecap="round" />
    <line x1="18" y1="12" x2="18" y2="24" stroke="#FFFDF9" stroke-width="1.3" stroke-linecap="round" />
    <!-- Target Core -->
    <circle cx="18" cy="18" r="3.2" stroke="#FFFDF9" stroke-width="1.2" fill="none" />
    <circle cx="18" cy="18" r="1.6" fill="#BE123C" />
  </g>

  <!-- Typography Group -->
  <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.03em" fill="#0F172A">
    FLIRT<tspan fill="#BE123C">CHECK</tspan>
  </text>
  
  <text x="48" y="34" font-family="'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.12em" fill="#475569">
