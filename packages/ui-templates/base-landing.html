<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
    <main class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6 text-center transform transition-all hover:scale-[1.01]">
        <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">
            Exclusive Access
        </h1>
        <p class="text-lg text-gray-500 leading-relaxed">
            You've been selected for a limited-time opportunity. Secure your spot before it expires.
        </p>
        
        <div class="pt-6 pb-2">
            <a href="https://example.com/offer" id="cta-button" class="group relative w-full flex items-center justify-center px-8 py-4 text-lg font-bold rounded-xl text-white bg-indigo-600 overflow-hidden shadow-lg hover:shadow-indigo-500/30 transition-all duration-300">
                <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black"></span>
                <span class="relative">Claim Your Offer Now</span>
                <svg class="ml-2 w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </a>
        </div>
        
        <div class="flex items-center justify-center space-x-2 text-sm text-gray-400">
            <svg class="w-4 h-4 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
            <span>Verified Secure & Encrypted</span>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const clickId = urlParams.get('click_id') || urlParams.get('sub_id') || '';
            
            if (clickId) {
                const ctaButton = document.getElementById('cta-button');
                if (ctaButton) {
                    try {
                        const originalUrl = new URL(ctaButton.href);
                        originalUrl.searchParams.set('click_id', clickId);
                        ctaButton.href = originalUrl.toString();
                        console.log('Appended tracking ID to outbound link.');
                    } catch (e) {
                        console.error('Error updating URL:', e);
                    }
                }
            }
        });
    </script>
</body>
</html>
